name: Support Watch

on:
  schedule:
    - cron: '*/30 * * * *'   # fallback only: GitHub throttles schedules (observed ~30 min gaps). The 10-min cadence comes from cron-job.org calling the dispatches API.
  workflow_dispatch:

# Public repo: scheduled workflows are disabled after 60 days without repo activity, so the job commits a
# one-line marker once a day (last step). Secrets never touch the repo. The page is published to GitHub Pages:
# free, no deploy quota (Netlify's free plan charges 15 credits per deploy, i.e. 20 deploys a month).
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: support-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect flow runs and build the page
        shell: pwsh
        env:
          CLIENTS_JSON: ${{ secrets.CLIENTS_JSON }}
          RT_SEMO:      ${{ secrets.RT_SEMO }}
          RT_TSMO:      ${{ secrets.RT_TSMO }}
          CARRY_URL:    ${{ secrets.CARRY_URL }}
        run: ./collect.ps1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # After the deploy so a mail problem never blocks the page. A failure here turns the job red and GitHub emails the owner.
      - name: Email new failures and the daily digest
        shell: pwsh
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO:       ${{ secrets.MAIL_TO }}
        run: ./notify.ps1

      - name: Save alert state; keep the schedule alive (one commit a day)
        if: always()
        run: |
          today=$(date -u +%F)
          [ "$(cat last-run.txt 2>/dev/null)" = "$today" ] || echo "$today" > last-run.txt
          git add last-run.txt alerts.json
          if ! git diff --cached --quiet; then
            git config user.name  "support-watch bot"
            git config user.email "support-watch@users.noreply.github.com"
            git commit -m "state $today" -q
            git pull --rebase -q && git push -q
          fi
