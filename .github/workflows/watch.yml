name: Support Watch

on:
  schedule:
    - cron: '*/30 * * * *'   # fallback only: GitHub throttles schedules (observed ~30 min gaps). The 10-min cadence comes from cron-job.org calling the dispatches API.
  workflow_dispatch:
    inputs:
      sample:
        description: Send a sample failure alert (one real flow per client marked failed; nothing saved)
        type: boolean
        default: false
      digest:
        description: Send the weekly recap now, prefixed [Sample] (nothing saved)
        type: boolean
        default: false
      sample_ops:
        description: Send a sample stuck-run alert and a sample stale-client alert, prefixed [Sample] (nothing saved)
        type: boolean
        default: false
      to:
        description: Recipient override for the sample sends above (ignored otherwise)
        type: string
        default: ''

# Public repo: scheduled workflows are disabled after 60 days without repo activity, so the job commits a
# one-line marker once a day (last step). Secrets never touch the repo. The page is published to Azure Static
# Web Apps (free tier, sign-in required); GitHub Pages had no access control and Netlify's free plan a deploy quota.
permissions:
  contents: write

concurrency:
  group: support-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Collect flow runs and build the page
        shell: pwsh
        env:
          CLIENTS_JSON: ${{ secrets.CLIENTS_JSON }}
          RT_TSMO:      ${{ secrets.RT_TSMO }}
          MC_TSMO:      ${{ secrets.MC_TSMO }}   # Message Center token (get-refresh-token.ps1 -MessageCenter): Tech watch tab, service changes
          # Which Message Center messages to keep: a regex on the message's services and title. Same default inside collect.ps1 (the SEMO function has no setting).
          WATCH_SERVICES: 'Power (Platform|Apps|Automate|BI|Pages)|Copilot Studio|Dataverse|Dynamics|Entra|licen[cs]|pricing|subscription'
          CARRY_URL:    ${{ secrets.CARRY_URL }}
          CARRY_CLIENTS: SEMO   # collected by the Azure function only (azure-function/), never from here
          ODOO_URL:     ${{ secrets.ODOO_URL }}    # Odoo Helpdesk: tickets in progress (Helpdesk tab)
          ODOO_USER:    ${{ secrets.ODOO_USER }}
          ODOO_KEY:     ${{ secrets.ODOO_KEY }}
          # Credentials with a fixed expiry, dates only ("label=YYYY-MM-DD; label=..."): shown under the page title, mailed 14 days ahead and once expired.
          # After renewing one, store the new secret and put the new date here. Refresh tokens roll over with use and have no date.
          EXPIRIES:     'cron-job.org token (GitHub dispatches, fine-grained)=2027-09-30'
          # Tech watch tab, bottom section: public RSS/Atom feeds, one per line "Label | URL | optional regex on the item's title and categories",
          # read once a day. General (not per client). The M365 roadmap lists every Microsoft product, so its regex keeps the ones we support; blogs are taken whole.
          WATCH_FEEDS: |
            Power Automate blog | https://www.microsoft.com/en-us/power-platform/blog/power-automate/feed/
            Power Apps blog | https://www.microsoft.com/en-us/power-platform/blog/power-apps/feed/
            Power BI blog | https://powerbi.microsoft.com/en-us/blog/feed/
            Microsoft 365 blog | https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=microsoft_365blog
            Microsoft Entra blog | https://techcommunity.microsoft.com/t5/s/gxcuf89792/rss/board?board.id=microsoft-entra-blog
            Microsoft 365 roadmap | https://www.microsoft.com/releasecommunications/api/v2/m365/rss | Power (Apps|Automate|Platform|BI|Pages)|Copilot Studio|Dataverse|SharePoint|Microsoft 365 admin center|Microsoft Entra
        run: ./scripts/collect.ps1

      # Azure Static Web Apps (free tier): the site requires a Microsoft sign-in and the invited "reader" role (scripts/staticwebapp.config.json).
      - id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: out/site
          skip_app_build: true

      # After the deploy so a mail problem never blocks the page. A failure here turns the job red and GitHub emails the owner.
      # A run is pinned to the commit it was triggered on, so a run that waited behind another would read stale alerts.json,
      # send the same emails again, then fail to push its state: fast-forward first.
      - name: Email new failures and the daily digest
        shell: pwsh
        env:
          SMTP_HOST:     ${{ secrets.SMTP_HOST }}
          SMTP_USER:     ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO:       ${{ (inputs.sample || inputs.digest || inputs.sample_ops) && inputs.to || secrets.MAIL_TO }}   # the override applies to sample sends only
        run: git pull -q --ff-only; ./scripts/notify.ps1 -Sample:('${{ inputs.sample }}' -eq 'true') -SampleDigest:('${{ inputs.digest }}' -eq 'true') -SampleOps:('${{ inputs.sample_ops }}' -eq 'true')

      # Dead-man's switch: a healthchecks.io check expects this ping every 10 min (grace 1 h) and emails when it stops, i.e. when the
      # job no longer runs or no longer gets this far (cron-job.org token expired, GitHub schedule disabled, collector broken, ...).
      # Only on success (every step above worked). Skipped when the HEALTHCHECK_URL secret is unset.
      - name: Ping the dead-man's switch
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: '[ -z "$HEALTHCHECK_URL" ] || curl -fsS -m 10 --retry 3 -o /dev/null "$HEALTHCHECK_URL"'

      - name: Save alert state; keep the schedule alive (one commit a day)
        if: always()
        run: |
          today=$(date -u +%F)
          [ "$(cat state/last-run.txt 2>/dev/null)" = "$today" ] || echo "$today" > state/last-run.txt
          git add state/last-run.txt state/alerts.json state/news.csv
          if ! git diff --cached --quiet; then
            git config user.name  "support-watch bot"
            git config user.email "support-watch@users.noreply.github.com"
            git commit -m "state $today" -q
            git pull --rebase -q && git push -q
          fi
