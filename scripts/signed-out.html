<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support Monitoring System</title>
<style>
  :root { --bg:#f8f7f5; --fg:#262e3a; --muted:#76706a; --accent:#e95664; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a212a; --fg:#e4ded7; --muted:#cdc1b8; --accent:#ed7883; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; box-sizing:border-box; background:var(--bg); color:var(--fg); font:15px/1.5 "DM Sans", system-ui, sans-serif; text-align:center; }
  h1 { font:400 28px/1.1 "Palatino Linotype", Palatino, Georgia, serif; margin:0 0 10px; }
  p { color:var(--muted); margin:0 0 18px; max-width:38em; }
  a { color:var(--accent); }
</style>
</head>
<body>
<div>
  <h1>Signed out</h1>
  <p>Your session on the Support Monitoring System is closed. Your Microsoft account itself stays signed in, so signing back in will not ask for a password.</p>
  <a href="/.auth/login/aad?post_login_redirect_uri=/">Sign in</a>
</div>
</body>
</html>
